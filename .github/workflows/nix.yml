name: Nix build

on:
  workflow_dispatch:
  push:
    branches: [multi-proto]
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/nix.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Build the Nix package
        run: nix build --print-build-logs
      - name: Check the installed version
        run: QT_QPA_PLATFORM=offscreen ./result/bin/kolf --version
