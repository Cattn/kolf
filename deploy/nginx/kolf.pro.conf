# nginx site for kolf.pro. Install into /etc/nginx/sites-available/ and link it
# from sites-enabled. Obtain the certificate first (see deploy/README.md).

map $http_upgrade $kolf_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name kolf.pro www.kolf.pro;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://kolf.pro$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kolf.pro;
    ssl_certificate /etc/letsencrypt/live/kolf.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolf.pro/privkey.pem;
    return 301 https://kolf.pro$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kolf.pro;

    ssl_certificate /etc/letsencrypt/live/kolf.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolf.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;
    root /var/www/kolf.pro;
    index index.html;

    location = /ws {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kolf_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ~ ^/(healthz|status)$ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /join/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
